# CI/CD: gatilho do Cloud Build apontando para esta pasta
# (Build config: gcp-decision-intelligence/cloudbuild.yaml,
#  diretório: gcp-decision-intelligence).
# A service account do Cloud Build precisa de roles/run.admin e
# roles/iam.serviceAccountUser na SA do Cloud Run.
substitutions:
  _REGION: southamerica-east1
  _SERVICE: decision-intelligence
  _AR_REPO: decision-intelligence
  _SQL_INSTANCE: decision-intel-db
  _DB_NAME: business_ai
  _DB_USER: app_user
  _DB_PASS_SECRET: decision-intel-db-pass
  _RUN_SA_NAME: decision-intel-run

steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA", "."]

  - name: gcr.io/cloud-builders/docker
    args: ["push", "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA"]

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=${_RUN_SA_NAME}@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:${_SQL_INSTANCE}
      - --set-env-vars=INSTANCE_CONNECTION_NAME=$PROJECT_ID:${_REGION}:${_SQL_INSTANCE},DB_NAME=${_DB_NAME},DB_USER=${_DB_USER},GCS_BUCKET=$PROJECT_ID-decision-intel
      - --set-secrets=DB_PASS=${_DB_PASS_SECRET}:latest
      - --memory=2Gi
      - --cpu=2
      - --timeout=3600
      - --session-affinity
      - --allow-unauthenticated

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/${_SERVICE}:$SHORT_SHA
